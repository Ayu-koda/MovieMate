<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MovieMate — Intelligent Movie Recommender</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6fb;
        color: #18294d;
        min-height: 100vh;
      }

      /* ================= NAVBAR ================= */

      .navbar {
        height: 76px;
        background: linear-gradient(135deg, #18294d, #24365d);
        color: white;

        display: flex;
        align-items: center;
        padding: 0 45px;

        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .brand-icon {
        font-size: 42px;
      }

      .brand-name {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .brand-name span {
        color: #8b6cff;
      }

      .tagline {
        margin-left: 40px;
        font-size: 18px;
        color: #d9deea;
      }

      .nav-links {
        margin-left: auto;
        display: flex;
        gap: 35px;
      }

      .nav-link {
        color: #e6e9f0;
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        padding: 27px 5px;
      }

      .nav-link.active {
        border-bottom: 3px solid #8b6cff;
      }

      /* ================= MAIN ================= */

      .container {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 22px 20px 50px;
      }

      /* ================= SEARCH CARD ================= */

      .search-card {
        max-width: 820px;
        margin: 0 auto 30px;

        background: white;
        border-radius: 18px;

        padding: 25px 50px 32px;

        box-shadow: 0 8px 25px rgba(31, 45, 75, 0.08);

        text-align: center;
      }

      .movie-icon {
        font-size: 55px;
        margin-bottom: 5px;
      }

      .search-card h1 {
        font-size: 38px;
        margin-bottom: 5px;
        color: #192b50;
      }

      .subtitle {
        color: #687998;
        font-size: 20px;
        margin-bottom: 25px;
      }

      .form-container {
        text-align: left;
      }

      .form-container label {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 7px;
      }

      .input-wrapper {
        position: relative;
      }

      #userId {
        width: 100%;
        height: 52px;

        border: 2px solid #dbe1ec;
        border-radius: 12px;

        padding: 0 16px;

        font-size: 17px;
        color: #25385e;

        outline: none;

        transition: 0.2s;
      }

      #userId:focus {
        border-color: #7860e8;
        box-shadow: 0 0 0 4px rgba(120, 96, 232, 0.12);
      }

      .recommend-button {
        width: 100%;
        height: 53px;

        margin-top: 15px;

        border: none;
        border-radius: 12px;

        background: linear-gradient(135deg, #7459e8, #8064f0);

        color: white;

        font-size: 18px;
        font-weight: 700;

        cursor: pointer;

        transition: all 0.2s ease;

        box-shadow: 0 5px 12px rgba(116, 89, 232, 0.25);
      }

      .recommend-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(116, 89, 232, 0.35);
      }

      .recommend-button:active {
        transform: translateY(0);
      }

      /* ================= RESULTS ================= */

      .results-card {
        background: white;

        border-radius: 18px;

        padding: 25px 35px 30px;

        box-shadow: 0 8px 25px rgba(31, 45, 75, 0.08);
      }

      .results-title {
        display: flex;
        align-items: center;
        gap: 12px;

        font-size: 30px;
        font-weight: 800;

        margin-bottom: 15px;

        color: #192b50;
      }

      .results-icon {
        font-size: 30px;
      }

      .movie-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .movie-item {
        display: flex;
        align-items: center;

        min-height: 78px;

        background: linear-gradient(
          90deg,
          #f1f0ff,
          #f5f5ff
        );

        border-radius: 13px;

        padding: 10px 18px;

        transition: transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .movie-item:hover {
        transform: translateX(4px);
        box-shadow: 0 5px 15px rgba(61, 67, 120, 0.1);
      }

      .movie-poster {
        width: 70px;
        height: 58px;

        border-radius: 9px;

        object-fit: cover;

        background: #dfe3ef;

        margin-right: 18px;
      }

      .movie-info {
        flex: 1;
      }

      .movie-title {
        font-size: 19px;
        font-weight: 700;

        color: #17294e;

        margin-bottom: 4px;
      }

      .movie-meta {
        font-size: 16px;
        color: #657696;
      }

      .score {
        background: #d3f3e4;
        color: #0d8b52;

        font-size: 15px;
        font-weight: 700;

        padding: 11px 16px;

        border-radius: 13px;

        white-space: nowrap;
      }

      .empty-state {
        text-align: center;
        padding: 35px;
        color: #71809b;
        font-size: 17px;
      }

      .loading {
        text-align: center;
        padding: 30px;
        color: #6d5bd0;
        font-weight: 600;
      }

      /* ================= FOOTER ================= */

      .footer {
        text-align: center;
        color: #7a879f;
        font-size: 14px;
        padding: 25px;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 800px) {
        .navbar {
          padding: 0 20px;
        }

        .tagline {
          display: none;
        }

        .nav-links {
          gap: 15px;
        }

        .search-card {
          padding: 25px 25px 30px;
        }

        .search-card h1 {
          font-size: 30px;
        }

        .results-card {
          padding: 22px 18px;
        }

        .movie-item {
          padding: 10px;
        }

        .movie-poster {
          width: 55px;
          height: 50px;
          margin-right: 12px;
        }

        .movie-title {
          font-size: 16px;
        }

        .movie-meta {
          font-size: 13px;
        }

        .score {
          font-size: 13px;
          padding: 8px 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">
      <div class="brand">
        <div class="brand-icon">🎬</div>

        <div class="brand-name">
          Movie<span>Mate</span>
        </div>
      </div>

      <div class="tagline">
        Intelligent Movie Recommender
      </div>

      <div class="nav-links">
        <a href="/" class="nav-link active">⌂ &nbsp;Home</a>
        <a href="#" class="nav-link">ⓘ &nbsp;About</a>
      </div>
    </nav>

    <!-- ================= MAIN CONTENT ================= -->

    <main class="container">

      <!-- SEARCH -->

      <section class="search-card">

        <div class="movie-icon">🎬</div>

        <h1>Movie Recommendations</h1>

        <p class="subtitle">
          Enter your User ID to get personalized movie recommendations
        </p>

        <form onsubmit="getRecommendations(event)">

          <div class="form-container">

            <label for="userId">
              Enter User ID:
            </label>

            <div class="input-wrapper">

              <input
                type="text"
                id="userId"
                name="userId"
                placeholder="e.g., 1, 10, 20, 50..."
                required
              />

            </div>

            <button
              type="submit"
              class="recommend-button"
            >
              ✨ &nbsp; Generate Recommendations
            </button>

          </div>

        </form>

      </section>

      <!-- RESULTS -->

      <section class="results-card">

        <h2 class="results-title">
          <span class="results-icon">🎞️</span>
          Recommended Movies
        </h2>

        <div class="results" id="results">

          <div class="empty-state">
            Enter a User ID above to discover your personalized movies.
          </div>

        </div>

      </section>

    </main>

    <footer class="footer">
      🎬 MovieMate — Personalized Movie Recommendations
    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script>
      async function getRecommendations(event) {
        event.preventDefault();

        const userId =
          document.getElementById("userId").value.trim();

        const output =
          document.getElementById("results");

        if (!userId) {
          return;
        }

        output.innerHTML = `
          <div class="loading">
            ✨ Finding the best movies for you...
          </div>
        `;

        try {
          const response = await fetch(
            `/api/recommend?userId=${encodeURIComponent(userId)}`
          );

          if (!response.ok) {
            throw new Error("Failed to fetch recommendations");
          }

          const data = await response.json();

          if (
            !data.recommendations ||
            data.recommendations.length === 0
          ) {
            output.innerHTML = `
              <div class="empty-state">
                😕 No recommendations found for this user.
              </div>
            `;

            return;
          }

          output.innerHTML = `
            <div class="movie-list">

              ${data.recommendations
                .map((rec, index) => {

                  const score =
                    Number(rec.score).toFixed(2);

                  return `
                    <div class="movie-item">

                      <div class="movie-poster">
                        🎬
                      </div>

                      <div class="movie-info">

                        <div class="movie-title">
                          ${index + 1}. ${rec.movieTitle}
                        </div>

                        <div class="movie-meta">
                          Personalized recommendation
                        </div>

                      </div>

                      <div class="score">
                        Score: ${score}
                      </div>

                    </div>
                  `;
                })
                .join("")}

            </div>
          `;

        } catch (error) {

          console.error(error);

          output.innerHTML = `
            <div class="empty-state">
              ⚠️ Something went wrong while getting recommendations.
              Please try again.
            </div>
          `;
        }
      }
    </script>

  </body>
</html>
